<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the film reach under the notch and the home
         indicator; the engine's safe-area insets are what keep the copy clear of
         them. theme-color paints the iOS/Android browser chrome the same charcoal
         as the page, so the URL bar doesn't sit as a white band over a dark film. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141210" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>DOT Designs - Sculptural Walls</title>
    <meta
      name="description"
      content="DOT Designs — a scroll-scrubbed camera flight through the DOT gallery of sculptural wall art. Hand-made relief, the signature Gold Wave, and bespoke plaster-and-gold finishes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <!-- First paint happens before the bundle or any stylesheet has parsed. Without
         this the browser shows its default white page for that gap, which on a
         near-black site reads as a flash of broken layout ahead of the loading
         screen. Charcoal here matches --sw-bg in World.css. -->
    <style>
      html,
      body {
        margin: 0;
        background: #141210;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
